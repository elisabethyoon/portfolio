<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<style>
.path{
 fill:none;
 stroke:white;
 stroke-width:4;
 stroke-linecap:round;
 stroke-dasharray:6 10;
}
</style>

<path class="path"
d="M40 120
C180 40, 320 40, 430 120
S650 210, 720 160
S790 60, 860 130
S1030 190, 1160 80"/>

<!-- refined hot-air balloon -->
<g transform="translate(110,70)">
  <!-- balloon body -->
  <path d="M0,-42
           C28,-42 46,-18 42,8
           C39,31 20,48 0,52
           C-20,48 -39,31 -42,8
           C-46,-18 -28,-42 0,-42 Z"
        fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>

  <!-- balloon panels -->
  <path d="M0,-40
           C-12,-20 -15,20 0,51
           C15,20 12,-20 0,-40 Z"
        fill="none" stroke="white" stroke-width="2.5"/>
  <path d="M-26,-24
           C-10,-12 -8,20 -18,38"
        fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M26,-24
           C10,-12 8,20 18,38"
        fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- bottom tie -->
  <path d="M-15,47 L-8,62 M15,47 L8,62" 
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- basket -->
  <path d="M-12,62 H12 L9,78 H-9 Z"
        fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  <line x1="-8" y1="66" x2="8" y2="66" stroke="white" stroke-width="2"/>
</g>

<!-- arrow -->
<g transform="translate(1160,80)">
<line x1="-18" y1="8" x2="0" y2="0" stroke="white" stroke-width="3"/>
<line x1="-12" y1="-10" x2="0" y2="0" stroke="white" stroke-width="3"/>
</g>
</svg>
